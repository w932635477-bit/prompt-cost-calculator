      "mainEntity": [{"@type":"Question","name":"What does the cron expression 0 0 * * 5 mean?","acceptedAnswer":{"@type":"Answer","text":"The expression 0 0 * * 5 means: at minute 0, hour 0, day-of-month *, month *, day-of-week 5. Each field in the cron expression controls a different time component: minute, hour, day of month, month, and day of week."}},{"@type":"Question","name":"How do I add 0 0 * * 5 to my crontab?","acceptedAnswer":{"@type":"Answer","text":"Run crontab -e in your terminal to open your crontab editor. Add a new line: 0 0 * * 5 /path/to/your/script.sh. Save and exit. Verify with crontab -l. Make sure your script is executable (chmod +x script.sh) and uses full paths for all commands."}},{"@type":"Question","name":"What is the equivalent of 0 0 * * 5 on Quartz / AWS / Kubernetes?","acceptedAnswer":{"@type":"Answer","text":"Quartz Scheduler: 0 0 * * 5. AWS EventBridge: cron(0 0 ? * 5 *). Kubernetes CronJob: schedule: \"0 0 * * 5\" (standard 5-field format). Each platform has slight syntax differences — use our dialect switcher above to get the exact expression."}},{"@type":"Question","name":"How do cron day-of-week numbers work?","acceptedAnswer":{"@type":"Answer","text":"Standard Unix cron uses 0-6: Sunday=0, Monday=1, Tuesday=2, Wednesday=3, Thursday=4, Friday=5, Saturday=6. Some implementations also accept 7 for Sunday. Quartz uses text labels: SUN, MON, TUE, WED, THU, FRI, SAT."}},{"@type":"Question","name":"What are common mistakes when using 0 0 * * 5?","acceptedAnswer":{"@type":"Answer","text":"Common pitfalls: (1) Cron uses a minimal PATH — always use full paths to commands and scripts. (2) Percent signs (%) must be escaped with backslash in crontab. (3) Cron runs in the system timezone — set CRON_TZ=UTC at the top of your crontab for consistent UTC scheduling. (4) Redirect output to prevent email spam: 0 0 * * 5 /path/command >> /var/log/myjob.log 2>&1. (5) Test your cron expression with crontab.guru or our validator above before deploying."}},{"@type":"Question","name":"Friday vs Monday cron — which is better for weekly tasks?","acceptedAnswer":{"@type":"Answer","text":"Friday is better for end-of-week tasks: weekly reports, data exports, backups before the weekend. Monday is better for start-of-week tasks: resetting counters, sending reminders, pulling weekend data. Choose based on when your team needs the output, not when the server is idle."}},{"@type":"Question","name":"How do I run a cron job every Friday at a specific time?","acceptedAnswer":{"@type":"Answer","text":"Change the hour field to set the time: 0 9 * * 5 runs at 9 AM Friday, 0 17 * * 5 runs at 5 PM Friday, 0 12 * * 5 runs at noon Friday. The minute field controls minutes within the hour: 30 14 * * 5 runs at 2:30 PM Friday."}}]
